name: Plan New Campaign (from ASIN)

on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: 'Marketplace'
        type: choice
        required: true
        options: [IT, FR, DE, ES, UK, NL, SE, PL, BE, IE]
      asin:
        description: 'ASIN principale (parent o child hero)'
        required: true
      children:
        description: 'ASIN child aggiuntivi (separati da virgola)'
        required: false
        default: ''
      skus:
        description: 'Mappa ASIN=SKU (es. B0X=SKU-A,B0Y=SKU-B) - necessaria da seller'
        required: false
        default: ''
      budget:
        description: 'Budget giornaliero indicativo (EUR)'
        required: false
        default: '8'
      target_acos:
        description: 'Target ACoS (%)'
        required: false
        default: '30'
      child_note:
        description: 'Come differiscono i child? (es. "solo colore" oppure "misure S/M/L")'
        required: false
        default: ''
      structure:
        description: >-
          Struttura: auto = decide il modello; shared = campagna di GRUPPO (tutti i
          child insieme); per_child = una campagna per OGNI child
        type: choice
        required: false
        default: auto
        options: [auto, shared, per_child]
      listing_text:
        description: 'Testo del listing: titolo + bullet + descrizione (incolla)'
        required: false
        default: ''
      reviews_text:
        description: 'Estratti di recensioni (incolla, opzionale)'
        required: false
        default: ''
      seed_keywords:
        description: 'Keyword note a mano (opzionale)'
        required: false
        default: ''
      no_amazon_recs:
        description: 'Salta le keyword recommendations di Amazon'
        type: boolean
        required: false
        default: false
      days:
        description: 'Giorni di storico da analizzare (max 31)'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Genera blueprint
        # TUTTI gli input dell'utente passano da qui come variabili d'ambiente e
        # vengono citati con "$VAR" nel run: MAI interpolati come ${{ ... }}
        # dentro la riga di comando. Sono testo libero (child_note, seed_keywords
        # e skus soprattutto): una virgoletta o un backtick spezzerebbe il
        # comando, o peggio eseguirebbe altro. Stesso principio di CONTENT_JSON
        # in apply-listing.yml e di EXTRA_INSTRUCTIONS in build-listing.yml.
        env:
          AMAZON_ADS_CLIENT_ID: ${{ secrets.AMAZON_ADS_CLIENT_ID }}
          AMAZON_ADS_CLIENT_SECRET: ${{ secrets.AMAZON_ADS_CLIENT_SECRET }}
          AMAZON_ADS_REFRESH_TOKEN: ${{ secrets.AMAZON_ADS_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          LISTING_TEXT: ${{ github.event.inputs.listing_text }}
          REVIEWS_TEXT: ${{ github.event.inputs.reviews_text }}
          IN_MARKETPLACE: ${{ github.event.inputs.marketplace }}
          IN_ASIN: ${{ github.event.inputs.asin }}
          IN_CHILDREN: ${{ github.event.inputs.children }}
          IN_SKUS: ${{ github.event.inputs.skus }}
          IN_BUDGET: ${{ github.event.inputs.budget }}
          IN_TARGET_ACOS: ${{ github.event.inputs.target_acos }}
          IN_CHILD_NOTE: ${{ github.event.inputs.child_note }}
          IN_SEED_KEYWORDS: ${{ github.event.inputs.seed_keywords }}
          IN_DAYS: ${{ github.event.inputs.days }}
          IN_STRUCTURE: ${{ github.event.inputs.structure }}
          IN_NO_AMAZON_RECS: ${{ github.event.inputs.no_amazon_recs }}
        run: |
          cd python
          printf '%s' "$LISTING_TEXT" > _listing.txt
          printf '%s' "$REVIEWS_TEXT" > _reviews.txt
          EXTRA=""
          if [ "$IN_NO_AMAZON_RECS" = "true" ]; then EXTRA="--no-amazon-recs"; fi
          python campaign_planner.py \
            --marketplace "$IN_MARKETPLACE" \
            --asin "$IN_ASIN" \
            --children "$IN_CHILDREN" \
            --skus "$IN_SKUS" \
            --budget "$IN_BUDGET" \
            --target-acos "$IN_TARGET_ACOS" \
            --child-note "$IN_CHILD_NOTE" \
            --seed-keywords "$IN_SEED_KEYWORDS" \
            --structure "${IN_STRUCTURE:-auto}" \
            --listing-file _listing.txt \
            --reviews-file _reviews.txt \
            --days "$IN_DAYS" \
            --sqp-dir ../public/data \
            --publish-dir ../plans \
            --fetch $EXTRA

      - name: Commit blueprint per la UI
        env:
          IN_MARKETPLACE: ${{ github.event.inputs.marketplace }}
          IN_ASIN: ${{ github.event.inputs.asin }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f plans/ 2>/dev/null || true
          echo "File in plans/:"
          find plans/ -type f 2>/dev/null || echo "(nessuno)"
          git status --short
          if git diff --staged --quiet; then
            echo "Nessun blueprint da committare."
          else
            git commit -m "plan: $IN_MARKETPLACE/$IN_ASIN [skip ci]"
            # Senza questo pull, se il repo si e' mosso mentre giravamo (un altro
            # workflow che committa, o un tuo push) il push fallisce, il blueprint
            # non arriva mai nel repo e la UI resta in attesa fino al timeout.
            # build-listing.yml lo fa gia': qui mancava.
            git pull --rebase --autostash || true
            git push
          fi

      - name: Upload blueprint (artefatto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-plan-${{ github.event.inputs.marketplace }}-${{ github.run_number }}
          path: python/plans/*
          retention-days: 90
