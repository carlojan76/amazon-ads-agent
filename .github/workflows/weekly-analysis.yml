on:
  schedule:
    # Ogni lunedì alle 07:00 UTC (08:00 ora italiana in inverno, 09:00 in estate)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    # Permette di lanciarlo manualmente dal tab Actions
    inputs:
      marketplaces:
        description: 'Marketplaces da analizzare (es. IT,FR,DE,ES)'
        required: false
        default: 'IT,FR,DE,ES'
      days:
        description: 'Giorni da analizzare'
        required: false
        default: '14'

permissions:
  contents: write

# Un dispatch manuale lanciato mentre gira quello schedulato faceva partire due
# analisi in parallelo sugli stessi marketplace: doppia spesa di token e due
# commit che si contendono lo stesso file. Si accoda invece di sovrapporsi
# (cancel-in-progress: false — non si butta via un run da 45 minuti).
concurrency:
  group: weekly-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Run weekly analysis
        env:
          # Amazon Advertising API credentials
          AMAZON_ADS_CLIENT_ID: ${{ secrets.AMAZON_ADS_CLIENT_ID }}
          AMAZON_ADS_CLIENT_SECRET: ${{ secrets.AMAZON_ADS_CLIENT_SECRET }}
          AMAZON_ADS_REFRESH_TOKEN: ${{ secrets.AMAZON_ADS_REFRESH_TOKEN }}

          # Anthropic API
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Email (Gmail SMTP)
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Parametri (override manuale se eseguito on-demand)
          MARKETPLACES: ${{ github.event.inputs.marketplaces || 'IT,FR,DE,ES' }}
          ANALYSIS_DAYS: ${{ github.event.inputs.days || '14' }}
          # Report API v3 spesso richiedono 15-25 min: 600s erano troppo pochi
          # e facevano tornare dati VUOTI (tutti zero) per timeout.
          REPORT_MAX_WAIT: "1800"

          # Worker Cloudflare: registro delle azioni applicate, storico,
          # tetti sui bid. Se i secret non ci sono, lo script continua
          # esattamente come prima.
          AGENT_API_BASE: ${{ secrets.AGENT_API_BASE }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          LEDGER_LOOKBACK_DAYS: "28"
        run: |
          cd python
          python -u weekly_analysis.py

      - name: 📦 Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports-${{ github.run_number }}
          path: python/reports/
          retention-days: 30

      - name: 🌐 Pubblica dati per la UI online (GitHub Pages)
        if: always()
        run: |
          mkdir -p public/data
          if [ -d python/reports/latest ]; then
            cp python/reports/latest/*.json public/data/ 2>/dev/null || true
          fi
          if [ -z "$(ls -A public/data 2>/dev/null)" ]; then
            echo "Nessun dato da pubblicare (nessun marketplace elaborato con successo)."
            exit 0
          fi
          git config user.name "amazon-ads-bot"
          git config user.email "actions@github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati pubblicati, skip commit."
            exit 0
          fi
          git commit -m "chore: aggiorna dati campagne per la UI online"

          # Push con rebase e ritentativi.
          #
          # Prima era un `git push` secco. Se nel frattempo un altro workflow
          # aveva committato (fetch-search-query-performance, build-listing),
          # il push moriva con non-fast-forward: ed essendo l'ultimo step,
          # si perdeva la pubblicazione dei dati DOPO 45 minuti di report.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push riuscito al tentativo $i."
              exit 0
            fi
            echo "Push fallito (tentativo $i), riallineo e riprovo..."
            sleep $((i * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || {
              echo "Rebase fallito: mi fermo senza forzare."
              exit 1
            }
          done
          echo "Push non riuscito dopo 5 tentativi."
          exit 1
