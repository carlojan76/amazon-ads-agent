name: Build Listing Copy (context + generazione)

# Workflow lanciabile dalla UI su GitHub Pages (dispatchWorkflow in src/github.js)
# oppure dal tab Actions. NON scrive nulla su Amazon: produce solo il brief e,
# se richiesto, la copy generata. L'applicazione vera sta in apply-listing.yml,
# con il suo gate di conferma.
#
# Output committati nel repo (li rilegge la UI con getRepoFileContents):
#   listings/context/<ASIN>_<MKT>.md    brief leggibile
#   listings/context/<ASIN>_<MKT>.json  pack grezzo (termini di ricerca/SQP inclusi:
#                                        SEMPRE riscritto, anche con generate=false)
#   listings/content/<ASIN>_<MKT>.json  copy generata (solo con generate=true)
#   listings/family/...                 variante famiglia — con generate=true la
#                                        (ri)genera con Claude; con generate=false
#                                        E il file esiste gia', NON lo tocca (solo
#                                        il context pack sopra si aggiorna): utile
#                                        per aggiornare i termini di ricerca senza
#                                        perdere una copy condivisa gia' approvata.
#   public/data/SQP_<MKT>.json          AGGIORNATO (non riscritto da zero): prima di
#                                        leggere i dati Search Query Performance, questo
#                                        workflow chiama ensure_sqp_for_asins() per l'ASIN
#                                        (+ i child, se family=true) che NON hanno ancora un
#                                        risultato qui — utile per prodotti mai pubblicizzati,
#                                        che il fetch periodico (weekly-analysis, limitato
#                                        agli ASIN con campagna) non raggiunge mai da solo.
#                                        Gli ASIN gia' presenti restano intatti.

on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: 'Marketplace'
        type: choice
        required: true
        options: [IT, FR, DE, ES, UK]
      asin:
        description: 'ASIN (parent se family=true)'
        required: true
      sku:
        description: 'SKU, se noto (salta il lookup ASIN->SKU)'
        required: false
        default: ''
      generate:
        description: 'Genera la copy con Claude (se false: solo brief)'
        type: boolean
        required: false
        default: true
      family:
        description: 'Tratta ASIN come parent e produci un family.json'
        type: boolean
        required: false
        default: false
      source_marketplace:
        description: 'Mercato da cui prendere la copy di riferimento (es. IT), se il target e vuoto'
        required: false
        default: ''
      reviews_sort:
        description: 'Ordinamento insight recensioni'
        type: choice
        required: false
        default: MENTIONS
        options: [MENTIONS, STAR_RATING_IMPACT]
      search_terms_top:
        description: 'Quanti termini di ricerca includere nel brief'
        required: false
        default: '20'
      no_image:
        description: 'Non passare la foto del prodotto al modello'
        type: boolean
        required: false
        default: false
      no_search_terms:
        description: 'Escludi i termini di ricerca dal brief'
        type: boolean
        required: false
        default: false
      no_sqp:
        description: 'Escludi il volume di ricerca reale (Search Query Performance) dal brief'
        type: boolean
        required: false
        default: false
      extra_instructions:
        description: >-
          Istruzione libera per Claude, valida SOLO per questa generazione (es. "niente
          emoji", "e' MDF non legno"): ha priorita' sulle regole generiche del contratto
          se in conflitto. La passa la UI (campo "Istruzioni particolari"), opzionale.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 45 (prima 20): il backfill SQP per ASIN mai pubblicizzati (vedi sopra) crea e
    # attende un report Amazon per ASIN, fino a 5 minuti di polling ciascuno nel
    # caso peggiore — con una famiglia di piu' child il totale puo' superare i 20
    # minuti originari anche se in pratica i report processano quasi sempre in meno
    # di un minuto.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      # I dati ads pubblicati da weekly-analysis.yml stanno in public/data/.
      # Se mancano, il brief si costruisce lo stesso: build_context lo segnala
      # e prosegue senza la sezione dei termini di ricerca.
      - name: Verifica dati ads disponibili
        run: |
          if [ -f "public/data/${{ github.event.inputs.marketplace }}.json" ]; then
            echo "Dati ads trovati per ${{ github.event.inputs.marketplace }}."
          else
            echo "::warning::Nessun public/data/${{ github.event.inputs.marketplace }}.json — il brief non avra i termini di ricerca. Lancia prima Weekly Analysis."
          fi
          if [ -f "public/data/SQP_${{ github.event.inputs.marketplace }}.json" ]; then
            echo "Dati Search Query Performance trovati per ${{ github.event.inputs.marketplace }}."
          else
            echo "::warning::Nessun public/data/SQP_${{ github.event.inputs.marketplace }}.json — il brief non avra il volume di ricerca reale. Lancia prima Fetch Search Query Performance."
          fi

      # Eseguito dalla root: python/ finisce comunque in sys.path (e' la cartella
      # dello script), cosi' gli import fra i moduli funzionano e gli output
      # relativi (listings/...) cadono alla root del repo, non dentro python/.
      - name: Costruisci brief e copy
        env:
          LWA_CLIENT_ID: ${{ secrets.LWA_CLIENT_ID }}
          LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
          LWA_REFRESH_TOKEN: ${{ secrets.LWA_REFRESH_TOKEN }}
          SP_API_SELLER_ID: ${{ secrets.SP_API_SELLER_ID }}
          SPAPI_ENDPOINT: https://sellingpartnerapi-eu.amazon.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          # Passato come variabile d'ambiente, MAI interpolato dentro la riga di comando
          # qui sotto: e' testo libero scritto dall'utente (puo' contenere virgolette,
          # $, backtick, a capo...) e build_context.py lo legge da EXTRA_INSTRUCTIONS
          # se --extra-instructions non e' passato — stesso principio di CONTENT_JSON
          # in apply-listing.yml, per evitare injection nella shell.
          EXTRA_INSTRUCTIONS: ${{ github.event.inputs.extra_instructions }}
        run: |
          EXTRA=""
          [ -n "${{ github.event.inputs.sku }}" ] && EXTRA="$EXTRA --sku ${{ github.event.inputs.sku }}"
          [ "${{ github.event.inputs.generate }}" = "true" ] && EXTRA="$EXTRA --generate"
          [ "${{ github.event.inputs.family }}" = "true" ] && EXTRA="$EXTRA --family"
          [ "${{ github.event.inputs.no_image }}" = "true" ] && EXTRA="$EXTRA --no-image"
          [ "${{ github.event.inputs.no_search_terms }}" = "true" ] && EXTRA="$EXTRA --no-search-terms"
          [ "${{ github.event.inputs.no_sqp }}" = "true" ] && EXTRA="$EXTRA --no-sqp"
          [ -n "${{ github.event.inputs.source_marketplace }}" ] && \
            EXTRA="$EXTRA --source-marketplace ${{ github.event.inputs.source_marketplace }}"

          python python/build_context.py \
            --asin "${{ github.event.inputs.asin }}" \
            --marketplace "${{ github.event.inputs.marketplace }}" \
            --reviews-sort "${{ github.event.inputs.reviews_sort }}" \
            --data-dir public/data \
            --search-terms-top "${{ github.event.inputs.search_terms_top }}" \
            --sqp-dir public/data \
            --outdir listings/context \
            $EXTRA

      - name: Commit output per la UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f listings/ 2>/dev/null || true
          # Solo il file SQP di QUESTO marketplace: il backfill (ensure_sqp_for_asins,
          # dentro build_context.py) puo' averlo aggiornato con gli ASIN di questa build
          # che non erano ancora coperti. Path esplicito, non public/data/ intero: non
          # vogliamo committare per sbaglio altri file di quella cartella.
          git add -f "public/data/SQP_${{ github.event.inputs.marketplace }}.json" 2>/dev/null || true
          git status --short
          if git diff --staged --quiet; then
            echo "Nessun output da committare."
          else
            git commit -m "listing: ${{ github.event.inputs.marketplace }}/${{ github.event.inputs.asin }} [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Upload output (artefatto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listing-${{ github.event.inputs.marketplace }}-${{ github.event.inputs.asin }}-${{ github.run_number }}
          path: listings/**
          retention-days: 90
          if-no-files-found: warn
