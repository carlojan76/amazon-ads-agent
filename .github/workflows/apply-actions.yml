name: Apply Amazon Ads Changes

# Workflow MANUALE per applicare modifiche alle campagne Amazon Ads.
# Si lancia dalla UI di GitHub: tab Actions -> Apply Amazon Ads Changes -> Run workflow.
#
# Flusso:
# 1. Scarica l'artefatto della weekly analysis (weekly-reports-N) dal tab Actions
# 2. Apri actions_XX_YYYYMMDD_HHMM.json in un editor di testo
# 3. Rivedi le azioni; cancella quelle su cui hai dubbi
# 4. Copia tutto il contenuto del file
# 5. Torna qui su Actions -> Run workflow, incolla il JSON, seleziona marketplace, digita APPLICA
# 6. Il workflow applica le modifiche via API

on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: 'Marketplace su cui applicare le modifiche'
        type: choice
        required: true
        options:
          - IT
          - FR
          - DE
          - ES
          - UK
          - NL
          - SE
          - PL
          - BE
          - IE
      actions_json:
        description: 'Contenuto del file actions_XX_YYYYMMDD_HHMM.json (incolla il JSON completo)'
        required: true
      confirm:
        description: 'Per confermare, digita APPLICA (case sensitive)'
        required: true
        default: 'NO'
      dry_run:
        description: 'Se true: mostra solo anteprima, non applica nulla'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Lock per marketplace. Due dispatch ravvicinati (due schede aperte, doppio
# click, o un retry impaziente) applicavano DUE VOLTE le stesse variazioni:
# su un update_bid significa due salti in cascata, ognuno "dentro" il limite
# del +-50% preso da solo. cancel-in-progress resta false: un run a meta'
# strada non va interrotto, va aspettato.
concurrency:
  group: apply-actions-${{ github.event.inputs.marketplace }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ✋ Verifica conferma
        if: ${{ github.event.inputs.confirm != 'APPLICA' && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "❌ Conferma non fornita o errata."
          echo "   Per procedere devi digitare esattamente: APPLICA"
          echo "   Hai digitato: '${{ github.event.inputs.confirm }}'"
          echo ""
          echo "Se vuoi solo vedere l'anteprima senza applicare, spunta invece il flag dry_run."
          exit 1

      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 📝 Scrivi actions.json
        env:
          ACTIONS_JSON: ${{ github.event.inputs.actions_json }}
        run: |
          cd python
          printf '%s' "$ACTIONS_JSON" > actions_input.json
          echo "--- Contenuto ricevuto ($(wc -c < actions_input.json) bytes) ---"
          head -80 actions_input.json
          echo "--- Validazione JSON ---"
          python -c "import json; json.load(open('actions_input.json')); print('OK')"

      - name: 🔍 Anteprima (sempre eseguita, anche prima di applicare)
        env:
          AMAZON_ADS_CLIENT_ID: ${{ secrets.AMAZON_ADS_CLIENT_ID }}
          AMAZON_ADS_CLIENT_SECRET: ${{ secrets.AMAZON_ADS_CLIENT_SECRET }}
          AMAZON_ADS_REFRESH_TOKEN: ${{ secrets.AMAZON_ADS_REFRESH_TOKEN }}
          AGENT_API_BASE: ${{ secrets.AGENT_API_BASE }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          cd python
          python apply_changes.py actions_input.json \
            --marketplace ${{ github.event.inputs.marketplace }} \
            --dry-run --json-out preview.json

      - name: 📋 Riepilogo leggibile dell'anteprima
        if: always()
        run: |
          cd python
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("preview.json")
          if not p.exists():
              print("## Anteprima non disponibile\n\nLo script si e' fermato prima di produrla: controlla il log del passo precedente.")
              raise SystemExit
          d = json.loads(p.read_text())
          print(f"## Anteprima — {d['marketplace']}\n")
          if d.get("guardrails"):
              print("### Bloccato dai limiti di sicurezza\n")
              for g in d["guardrails"]:
                  print(f"- {g}")
              print()
          caps = d.get("bid_caps") or {}
          if caps.get("violations"):
              print("### Bloccato dai tetti sui bid\n")
              for v in caps["violations"]:
                  print(f"- {v}")
              print()
          elif caps.get("resolved", {}).get("market") is not None:
              print(f"Tetto di mercato attivo: EUR {caps['resolved']['market']:.2f}\n")
          if d.get("fixes"):
              print("### Correzioni automatiche\n")
              for f in d["fixes"]:
                  print(f"- {f}")
              print()
          if d.get("skipped"):
              print("### Gia' allineate, non verranno inviate\n")
              for s in d["skipped"]:
                  print(f"- {s}")
              print()
          if d.get("preview"):
              print(f"### {len(d['preview'])} modifiche da applicare\n")
              for line in d["preview"]:
                  print(f"- `{line}`")
          PY

      - name: 🚀 Applica modifiche
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          AMAZON_ADS_CLIENT_ID: ${{ secrets.AMAZON_ADS_CLIENT_ID }}
          AMAZON_ADS_CLIENT_SECRET: ${{ secrets.AMAZON_ADS_CLIENT_SECRET }}
          AMAZON_ADS_REFRESH_TOKEN: ${{ secrets.AMAZON_ADS_REFRESH_TOKEN }}
          AGENT_API_BASE: ${{ secrets.AGENT_API_BASE }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          cd python
          python apply_changes.py actions_input.json \
            --marketplace ${{ github.event.inputs.marketplace }} \
            --yes --json-out applied.json

      - name: 🗂️ Committa il registro delle azioni applicate
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # apply_changes.py scrive applied/<MP>/<timestamp>.json con le sole
          # azioni CONFERMATE dall'API. Prima l'unica traccia era applied.json
          # fra gli artefatti del run, che scade dopo 90 giorni: passato quel
          # termine non restava modo di sapere cosa era stato applicato, ne'
          # per la weekly analysis ne' per te.
          if [ -z "$(ls -A applied 2>/dev/null)" ]; then
            echo "Nessuna azione confermata: niente da registrare."
            exit 0
          fi
          git config user.name "amazon-ads-bot"
          git config user.email "actions@github.com"
          git add -f applied
          if git diff --cached --quiet; then
            echo "Registro invariato."
            exit 0
          fi
          git commit -m "registro: azioni applicate su ${{ github.event.inputs.marketplace }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Registro pubblicato al tentativo $i."
              exit 0
            fi
            sleep $((i * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || {
              echo "Rebase fallito: il registro resta fra gli artefatti."
              exit 0
            }
          done
          # Il registro e' importante ma non deve far fallire un'applicazione
          # gia' andata a buon fine su Amazon: resta negli artefatti.
          echo "Push del registro non riuscito: i file restano fra gli artefatti."

      - name: ↩️ Come annullare
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          cd python
          for f in rollback_*.json; do
            [ -e "$f" ] || continue
            {
              echo "## Come annullare queste modifiche"
              echo ""
              echo "Scarica \`$f\` dagli artefatti di questo run e rilancia il workflow"
              echo "incollandone il contenuto in \`actions_json\`: riporta bid, budget e stati com'erano."
              python - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          if d.get("_manual_undo"):
              print("")
              print("Da fare a mano (l'API non espone un'azione inversa):")
              for m in d["_manual_undo"]:
                  print(f"- {m}")
          PY
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 📦 Upload log, anteprima e rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-log-${{ github.event.inputs.marketplace }}-${{ github.run_number }}
          path: |
            python/apply_log_*.json
            python/rollback_*.json
            python/preview.json
            python/applied.json
            applied/**/*.json
          retention-days: 90
          if-no-files-found: ignore
